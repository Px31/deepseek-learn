version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve

  backend:
    build: ./backend
    ports:
      - "8888:8888"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./backend/static:/app/static
      - ./backend/voices:/app/voices
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8888

volumes:
  ollama_data:
